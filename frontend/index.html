<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCompany Auto Service - Quality Automotive Care You Can Trust</title>
    <meta name="description" content="Professional automotive repair and maintenance services. Request a quote online, schedule service, and get quality care for your vehicle." />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      font-src 'self';
      connect-src 'self';
      frame-src 'none';
      object-src 'none';
    " />

    <!-- Open Graph -->
    <meta property="og:title" content="MyCompany Auto Service" />
    <meta property="og:description" content="Professional automotive repair and maintenance. Request a quote online today." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />

    <!-- JSON-LD Structured Data for Local Business -->
    <!-- name/description/telephone/email/address are patched at runtime from CMS settings — see DocumentHead.tsx -->
    <script type="application/ld+json" id="business-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "AutoRepair",
      "name": "MyCompany Auto Service",
      "description": "Quality automotive care you can trust. Professional repair and maintenance services.",
      "telephone": "(555) 123-4567",
      "email": "info@mycompany.com",
      "address": "123 Main Street, Your City, ST 12345",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "07:30",
          "closes": "17:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "08:00",
          "closes": "13:00"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
